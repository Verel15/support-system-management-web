name: Build and Push Frontend

on:
  push:
    tags:
      - 'v*'

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Test
        run: |
          echo "Running tests..."
          echo "Test passed!"


  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          echo "Building application..."
          echo "Version: ${{ github.ref_name }}"


  deploy-dev:
    name: Deploy DEV
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:
      - name: Deploy DEV
        run: |
          echo "Deploying to DEV..."
          echo "Version: ${{ github.ref_name }}"


  deploy-uat:
    name: Deploy UAT
    needs: deploy-dev
    runs-on: ubuntu-latest

    environment:
      name: uat

    steps:
      - name: Deploy UAT
        run: |
          echo "Deploying to UAT..."
          echo "Version: ${{ github.ref_name }}"


  deploy-prod:
    name: Deploy Production
    needs: deploy-uat
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Deploy Production
        run: |
          echo "Deploying Production..."
          echo "Version: ${{ github.ref_name }}"
