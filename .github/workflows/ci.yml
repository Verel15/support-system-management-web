name: Build and Push Frontend

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Running tests..."

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Building... ${{ github.ref_name }}"

  deploy-dev:
    name: Deploy DEV
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - run: echo "Deploying to DEV... ${{ github.ref_name }}"
