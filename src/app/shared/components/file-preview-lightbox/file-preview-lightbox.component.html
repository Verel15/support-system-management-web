@if (activeFile(); as file) {
  <div
    class="fixed inset-0 z-1100 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="'ดูตัวอย่าง ' + file.name"
    (click)="close()"
  >
    <!-- Top bar -->
    <div class="absolute top-0 inset-x-0 flex items-center justify-between px-4 py-3 sm:px-6 sm:py-4">
      <span class="text-sm text-white/90 truncate max-w-[60vw]">{{ file.name }}</span>
      <div class="flex items-center gap-2 shrink-0">
        <a
          [href]="file.url"
          [download]="file.name"
          class="inline-flex items-center justify-center w-10 h-10 rounded-full text-white hover:bg-white/10 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white"
          [attr.aria-label]="'ดาวน์โหลด ' + file.name"
          (click)="$event.stopPropagation()"
        >
          <i class="pi pi-download" aria-hidden="true"></i>
        </a>
        <button
          type="button"
          class="inline-flex items-center justify-center w-10 h-10 rounded-full text-white hover:bg-white/10 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white"
          aria-label="ปิด"
          (click)="$event.stopPropagation(); close()"
        >
          <i class="pi pi-times" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <!-- Prev / next -->
    @if (files().length > 1) {
      <button
        type="button"
        class="absolute left-2 sm:left-4 top-1/2 -translate-y-1/2 inline-flex items-center justify-center w-11 h-11 rounded-full bg-black/30 text-white hover:bg-black/50 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white"
        aria-label="ไฟล์ก่อนหน้า"
        (click)="$event.stopPropagation(); showPrev()"
      >
        <i class="pi pi-chevron-left" aria-hidden="true"></i>
      </button>
      <button
        type="button"
        class="absolute right-2 sm:right-4 top-1/2 -translate-y-1/2 inline-flex items-center justify-center w-11 h-11 rounded-full bg-black/30 text-white hover:bg-black/50 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white"
        aria-label="ไฟล์ถัดไป"
        (click)="$event.stopPropagation(); showNext()"
      >
        <i class="pi pi-chevron-right" aria-hidden="true"></i>
      </button>
    }

    <!-- Content -->
    <div class="max-w-[92vw] max-h-[75vh] flex items-center justify-center" (click)="$event.stopPropagation()">
      @if (file.isImage) {
        <img [src]="file.url" [alt]="file.name" class="max-w-[92vw] max-h-[75vh] object-contain rounded-lg shadow-2xl" />
      } @else {
        <div class="flex flex-col items-center gap-4 py-8 px-10 bg-white rounded-xl shadow-2xl">
          <i [class]="'pi ' + getFileIcon(file.name) + ' text-5xl text-primary-500'" aria-hidden="true"></i>
          <span class="text-sm text-slate-700">{{ file.name }}</span>
          <a
            [href]="file.url"
            [download]="file.name"
            target="_blank"
            rel="noopener"
            class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-primary-500 text-white text-sm font-medium hover:bg-primary-600 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
          >
            <i class="pi pi-external-link" aria-hidden="true"></i>
            เปิดไฟล์
          </a>
        </div>
      }
    </div>

    <!-- Thumbnail strip -->
    @if (files().length > 1) {
      <ul
        class="absolute bottom-0 inset-x-0 flex items-center justify-center gap-2 overflow-x-auto list-none p-3 sm:p-4 m-0"
        role="list"
        (click)="$event.stopPropagation()"
      >
        @for (thumb of files(); track thumb.id; let i = $index) {
          <li>
            <button
              type="button"
              class="flex items-center justify-center w-14 h-14 rounded-lg overflow-hidden border-2 transition-colors shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white"
              [class]="i === activeIndex() ? 'border-white' : 'border-transparent opacity-60 hover:opacity-100'"
              [attr.aria-label]="'ดูไฟล์ ' + thumb.name"
              [attr.aria-current]="i === activeIndex() ? 'true' : null"
              (click)="showAt(i)"
            >
              @if (thumb.isImage) {
                <img [src]="thumb.url" [alt]="thumb.name" class="w-full h-full object-cover" />
              } @else {
                <span class="flex items-center justify-center w-full h-full bg-slate-700">
                  <i [class]="'pi ' + getFileIcon(thumb.name) + ' text-white text-lg'" aria-hidden="true"></i>
                </span>
              }
            </button>
          </li>
        }
      </ul>
    }
  </div>
}
