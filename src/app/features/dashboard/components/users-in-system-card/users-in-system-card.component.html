<article class="bg-white rounded-lg border border-slate-200 p-6 flex flex-col gap-5">
  <!-- Header -->
  <h2 class="text-base font-semibold text-slate-800 border-l-4 border-primary-500 pl-3">
    ผู้ใช้ในระบบ
  </h2>

  <!-- Filters -->
  <div class="flex flex-col sm:flex-row sm:items-center gap-3">
    <!-- Left: dropdown filters -->
    <div class="flex flex-col sm:flex-row sm:flex-wrap sm:items-center gap-3 shrink-0">
      <p-select
        [options]="accountTypeOptions"
        [ngModel]="selectedAccountType()"
        (ngModelChange)="selectedAccountType.set($event); onFilterChange()"
        optionLabel="label"
        optionValue="value"
        placeholder="รูปแบบผู้ใช้"
        class="w-full sm:w-auto sm:min-w-36"
        aria-label="กรองตามประเภทผู้ใช้"
      />

      <p-select
        [options]="dateOptions"
        [ngModel]="selectedDate()"
        (ngModelChange)="selectedDate.set($event); onFilterChange()"
        optionLabel="label"
        optionValue="value"
        placeholder="วันที่สร้าง"
        class="w-full sm:w-auto sm:min-w-44"
        aria-label="กรองตามวันที่สร้าง"
      />
    </div>

    <!-- Right: search -->
    <div class="flex items-center gap-3 w-full sm:w-80 sm:ml-auto">
      <p-iconfield class="w-full">
        <p-inputicon class="pi pi-search" />
        <input
          pInputText
          type="search"
          placeholder="ค้นหา"
          class="w-full text-sm"
          [ngModel]="searchQuery()"
          (ngModelChange)="onSearch($event)"
          aria-label="ค้นหาผู้ใช้"
        />
      </p-iconfield>
    </div>
  </div>

  <!-- Table -->
  <app-data-table
    [columns]="columns"
    [data]="rows()"
    [totalRecords]="totalRecords()"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [loading]="loading()"
    [showActions]="false"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  >
    <ng-template dataTableCell="ticketCount" let-value="value">
      {{ value }}
    </ng-template>
  </app-data-table>
</article>
