<div class="flex flex-col min-h-full">
  <!-- Header -->
  <div class="relative flex items-center px-6 py-4 border-b border-slate-200">
    <p-button
      type="button"
      icon="pi pi-arrow-left"
      severity="secondary"
      variant="text"
      [rounded]="true"
      (onClick)="onBack()"
      aria-label="กลับ"
    />
    <h1
      class="absolute inset-0 flex items-center justify-center text-xl font-semibold text-slate-800 pointer-events-none truncate max-w-[60%] mx-auto"
    >
      {{ faq().question }}
    </h1>
    <button
      *appHasPermission="'manageDataAccess'"
      type="button"
      class="ml-auto w-8 h-8 flex items-center justify-center rounded text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
      aria-label="การดำเนินการ"
      aria-haspopup="true"
      (click)="onMenuOpen($event)"
    >
      <i class="pi pi-ellipsis-h" aria-hidden="true"></i>
    </button>
  </div>

  <!-- Content -->
  <div class="flex-1 p-6 grid grid-cols-12 gap-5 items-start">
    <!-- Left: Answer content -->
    <div class="col-span-12 md:col-span-8 flex flex-col gap-4">
      <h2 class="text-base font-semibold text-slate-800 border-l-4 border-primary-500 pl-3">
        คำตอบ
      </h2>
      <div class="rounded-xl border border-slate-200 bg-white p-5 prose max-w-none" [innerHTML]="faq().answer"></div>
    </div>

    <!-- Right: Info card -->
    <div class="col-span-12 md:col-span-4 rounded-xl border border-slate-200 bg-white overflow-hidden">
      <div class="flex items-center px-4 py-3 border-b border-slate-100">
        <h3 class="font-semibold text-slate-800 border-l-4 border-primary-500 pl-3">ข้อมูล</h3>
      </div>

      <div class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-3 items-center p-4">
        <span class="text-sm text-slate-500 whitespace-nowrap">หมวดหมู่</span>
        <app-chip [label]="faq().category" color="info" />

        <span class="text-sm text-slate-500 whitespace-nowrap">สถานะ</span>
        <app-status-chip [status]="faq().publishLabel" />

        <span class="text-sm text-slate-500 whitespace-nowrap">จำนวนเข้าชม</span>
        <span class="text-sm font-medium text-slate-800">{{ faq().viewCount }}</span>

        <span class="text-sm text-slate-500 whitespace-nowrap">วันที่สร้าง</span>
        <span class="text-sm font-medium text-slate-800">{{ faq().createdAt }}</span>

        <span class="text-sm text-slate-500 whitespace-nowrap">แก้ไขล่าสุด</span>
        <span class="text-sm font-medium text-slate-800">{{ faq().updatedAt }}</span>
      </div>
    </div>
  </div>
</div>

<app-confirm-dialog
  [(visible)]="showConfirmDialog"
  type="warning"
  title="ยืนยันการลบบทความ FAQ"
  confirmLabel="ยืนยัน"
  cancelLabel="ยกเลิก"
  (confirmed)="onDeleteFirstStepConfirmed()"
>
  คุณแน่ใจที่จะลบบทความ FAQ
  <strong class="text-primary-600">{{ faq().question }}</strong>
  ออกหรือไม่?
</app-confirm-dialog>

<app-delete-confirm-dialog
  [(visible)]="showDeleteDialog"
  [targetLabel]="faq().question"
  [loading]="deleting()"
  (confirmed)="onDeleteConfirmed($event)"
/>

<p-menu #actionMenu [model]="menuItems" [popup]="true" [appendTo]="'body'">
  <ng-template #item let-item pTemplate="item">
    <a class="p-menu-item-link" role="menuitem">
      <span class="p-menu-item-label" [class.text-error-600]="item.danger">{{ item.label }}</span>
    </a>
  </ng-template>
</p-menu>
