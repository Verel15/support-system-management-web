<div class="p-6 flex flex-col gap-5">
  <!-- Header -->
  <div class="flex items-center justify-between flex-wrap gap-3">
    <h1 class="text-2xl font-semibold text-slate-800">จัดการ Ticket</h1>
    <div class="flex items-center gap-2">
      <p-button
        label="Export รายงาน"
        icon="pi pi-download"
        severity="secondary"
        outlined
        (onClick)="showExportDialog.set(true)"
      />
      <div class="w-full sm:w-auto md:w-44">
        <p-button
          label="เพิ่ม Ticket"
          icon="pi pi-plus"
          (onClick)="onAddTicket()"
          severity="primary"
          fluid
        />
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="flex flex-col sm:flex-row sm:items-center gap-3 flex-wrap">
    <p-select
      [options]="statusOptions"
      [ngModel]="statusFilter()"
      (ngModelChange)="statusFilter.set($event); onFilterChange()"
      optionLabel="label"
      optionValue="value"
      class="w-full sm:w-auto sm:min-w-36"
      placeholder="สถานะ"
      aria-label="กรองตามสถานะ"
    />
    <p-datepicker
      [ngModel]="dateRangeFilter()"
      (ngModelChange)="onDateRangeChange($event)"
      selectionMode="range"
      [readonlyInput]="true"
      placeholder="ช่วงวันที่"
      [showIcon]="true"
      icon="pi pi-calendar"
      class="w-full sm:w-auto"
      styleClass="w-full sm:w-56"
      aria-label="กรองตามช่วงวันที่"
    />

    <div class="sm:flex-1"></div>

    <div class="w-full sm:w-80">
      <p-inputgroup>
        <input
          pInputText
          type="search"
          placeholder="ค้นหา"
          [ngModel]="searchQuery()"
          (ngModelChange)="searchQuery.set($event); onFilterChange()"
          aria-label="ค้นหา ticket"
        />
        <p-inputgroup-addon class="cursor-pointer relative" (click)="onFilterClick($event)">
          <i class="pi pi-sliders-h mr-2 text-primary-700" aria-hidden="true"></i>
          <span class="text-black">ตัวกรอง</span>
          @if (activeExtraFilterCount() > 0) {
            <span
              class="absolute -top-1.5 -right-1.5 inline-flex items-center justify-center min-w-4 h-4 px-1 text-[10px] font-semibold bg-primary-500 text-white rounded-full"
              [attr.aria-label]="activeExtraFilterCount() + ' ตัวกรองที่ใช้งาน'"
            >
              {{ activeExtraFilterCount() }}
            </span>
          }
        </p-inputgroup-addon>
      </p-inputgroup>
    </div>
    <app-ticket-filter #filterPanel [priorities]="priorities()" (apply)="onTicketFilterApply($event)" />
  </div>

  <!-- Table -->
  <app-data-table
    [columns]="columns"
    [data]="tableData()"
    [totalRecords]="totalRecords()"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [loading]="loading()"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
    (sortChange)="onSort($event)"
  >
    <!-- Title column with priority icon -->
    <ng-template dataTableCell="title" let-row let-value="value">
      <div class="flex items-center gap-2 min-w-0">
        @if (getPriorityIconClass(row); as iconClass) {
          <i [class]="iconClass + ' text-xs shrink-0'" aria-hidden="true"></i>
        }
        <span class="truncate" [title]="value">{{ value }}</span>
      </div>
    </ng-template>

    <!-- Assignees column -->
    <ng-template dataTableCell="assigneesDisplay" let-value="value">
      @if (value === '-') {
        <span class="inline-flex items-center gap-1 text-xs font-medium text-warning-700 bg-warning-50 px-2 py-1 rounded-full">
          <i class="pi pi-exclamation-circle text-xs" aria-hidden="true"></i>
          ยังไม่มอบหมาย
        </span>
      } @else {
        <span class="truncate" [title]="value">{{ value }}</span>
      }
    </ng-template>

    <!-- Status column -->
    <ng-template dataTableCell="currentStatusName" let-value="value">
      <app-status-chip [status]="$any(value)" />
    </ng-template>

    <!-- Actions column -->
    <ng-template dataTableCell="_actions" let-row>
      <button
        type="button"
        class="inline-flex items-center justify-center w-8 h-8 rounded text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-(--p-primary-500)"
        aria-label="ดูรายละเอียด"
        (click)="onViewTicketRow($event, row)"
      >
        <i class="pi pi-eye" aria-hidden="true"></i>
      </button>
    </ng-template>
  </app-data-table>

  <app-export-report-dialog
    [(visible)]="showExportDialog"
    [scope]="exportScope()"
    [baseFilter]="currentReportFilter()"
    [loading]="exporting()"
    (confirmed)="onExportConfirm($event)"
  />

  <app-pdf-preview-dialog
    [visible]="showPdfPreview()"
    [pdfUrl]="pdfPreviewUrl()"
    (download)="onPdfPreviewDownload()"
    (cancelled)="onPdfPreviewCancel()"
  />
</div>
