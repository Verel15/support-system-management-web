@if (loading()) {
  <div class="px-4 py-4">
    <div class="h-20 rounded-xl bg-slate-100 animate-pulse"></div>
  </div>
} @else if (suggested(); as candidate) {
  <div class="mx-4 my-4 rounded-xl border border-primary-200 bg-primary-50 p-4">
    <p class="flex items-center gap-1.5 text-xs font-semibold text-primary-700 mb-3">
      <i class="pi pi-bolt text-xs" aria-hidden="true"></i>
      แนะนำผู้รับผิดชอบ
    </p>

    <div class="flex items-center gap-3">
      <div
        class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm shrink-0 select-none bg-primary-500"
        aria-hidden="true"
      >{{ initial() }}</div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-slate-800 truncate">{{ candidate.fullName }}</p>
        <p class="text-xs text-slate-500 truncate">{{ candidate.positionName }} · {{ candidate.openTicketCount }} งานที่ถืออยู่</p>
      </div>
    </div>

    <div class="flex gap-2 mt-3">
      <button
        type="button"
        class="flex-1 inline-flex items-center justify-center gap-1.5 rounded-lg bg-primary-500 text-white text-sm font-semibold py-2 hover:bg-primary-600 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-primary-500 disabled:opacity-60"
        [disabled]="assigning()"
        (click)="onAssign()"
      >
        @if (assigning()) {
          <i class="pi pi-spin pi-spinner text-xs" aria-hidden="true"></i>
        }
        มอบหมายให้คนนี้
      </button>
      <button
        type="button"
        class="rounded-lg border border-slate-200 text-slate-600 text-sm font-medium px-3 py-2 hover:bg-white transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-primary-500"
        [disabled]="assigning()"
        (click)="pickManually.emit()"
      >
        เปลี่ยนคน
      </button>
    </div>
  </div>
} @else {
  <div class="mx-4 my-4 rounded-xl border border-warning-200 bg-warning-50 p-4">
    <p class="flex items-center gap-1.5 text-sm text-warning-700">
      <i class="pi pi-exclamation-triangle text-sm shrink-0" aria-hidden="true"></i>
      <span>{{ fallbackMessage() }}</span>
    </p>
    <button
      type="button"
      class="mt-3 w-full inline-flex items-center justify-center rounded-lg border border-warning-300 text-warning-700 text-sm font-semibold py-2 hover:bg-warning-100 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-warning-500"
      (click)="pickManually.emit()"
    >
      เลือกผู้รับผิดชอบ
    </button>
  </div>
}
