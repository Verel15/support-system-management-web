<div class="p-6 flex flex-col gap-6">
  <!-- Header -->
  <header class="flex items-center justify-between">
    <h1 class="text-2xl font-semibold text-slate-800">Tickets ของฉัน</h1>
    <div class="w-full sm:w-auto md:w-44">
      <p-button label="เพิ่ม Ticket" icon="pi pi-plus" [routerLink]="['add']" severity="primary" fluid />
    </div>
  </header>

  <!-- Recent Projects -->
  <section aria-labelledby="recent-projects-heading">
    <div class="flex items-center justify-between mb-4">
      <h2 id="recent-projects-heading" class="text-base font-semibold text-slate-800">
        โครงการล่าสุด
      </h2>
      <a routerLink="/dashboard/my-projects" class="text-sm text-primary-600 hover:text-primary-700 hover:underline">
        ดูทั้งหมด
      </a>
    </div>
    @if (recentProjects().length > 0) {
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4" role="list" aria-label="โครงการล่าสุด">
      @for (project of recentProjects(); track project.id) {
      <div role="listitem">
        <app-project-card [project]="project" [clickable]="true" (cardClick)="onProjectClick($event)" />
      </div>
      }
    </div>
    } @else {
    <div class="flex flex-col items-center justify-center gap-2 py-10 text-slate-400">
      <p class="text-sm font-medium">ยังไม่มีโครงการ</p>
    </div>
    }
  </section>

  <!-- Tabs & Content -->
  <section class="bg-white rounded-xl flex flex-col gap-4">
    <!-- Tabs -->
    <p-tabs [value]="activeTab()">
      <p-tablist>
        <p-tab [value]="0" (click)="onTabChange(0)">การทำงาน</p-tab>
        <p-tab [value]="1" (click)="onTabChange(1)">Tickets ของฉัน</p-tab>
        <p-tab [value]="2" (click)="onTabChange(2)">การตอบกลับ</p-tab>
      </p-tablist>
    </p-tabs>

    @switch (activeTab()) {
      @case (0) {
        <app-work-tickets-tab />
      }
      @case (1) {
        <app-my-tickets-tab />
      }
      @case (2) {
        <app-feedback-tab />
      }
    }
  </section>
</div>
